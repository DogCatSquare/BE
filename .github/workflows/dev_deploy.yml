name: CI/CD Pipeline

on:
  push:
    branches: [ dev ]  # dev 브랜치로 푸시할 때마다 실행

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4  # 저장소 코드 체크아웃

      - name: Set up JDK 17  # Java 개발 킷 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # GitHub Secret APPLICATION_YML 에 저장된 application.yml 내용을 파일로 생성
      # → DB URL, JWT 시크릿 등 실제 값이 이미 채워진 yml 이 빌드에 포함됨
      # → Firebase JSON 은 너무 길어서 yml 에 넣지 않고 아래 deploy 단계에서 별도로 주입
      - name: Make application.yml
        env:
          APP_YML: ${{ secrets.APPLICATION_YML }}
        shell: bash
        run: |
          mkdir -p ./src/main/resources
          printf '%s' "$APP_YML" > ./src/main/resources/application.yml
          test -s ./src/main/resources/application.yml || (echo "application.yml is empty" && exit 1)

      - name: Grant execute permission for gradlew  # gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: Build with Gradle  # Gradle을 사용하여 프로젝트 빌드
        uses: gradle/gradle-build-action@v3
        with:
          arguments: clean build -x test

      - name: Upload build artifact  # 빌드된 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: serverTest
          path: build/libs/*.jar

  deploy:
    needs: build  # build 작업이 성공적으로 완료된 후 실행
    runs-on: ubuntu-22.04

    steps:
      - name: Download build artifact  # 이전 단계에서 업로드한 아티팩트 다운로드
        uses: actions/download-artifact@v4
        with:
          name: serverTest
          path: build/libs/

      - name: Deploy to EC2
        env:
          # secrets 에 저장된 값은 쉘 스크립트에서 바로 쓸 수 없음
          # env 로 등록해야 아래 run 블록에서 $변수명 으로 사용 가능
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}                          # EC2 접속용 .pem 키 파일 내용
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}                        # EC2 로그인 유저명 (ubuntu)
          EC2_HOST: ${{ secrets.EC2_HOST }}                                # EC2 IP 주소 (3.39.188.10)
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }} # Firebase 서비스 계정 JSON
        shell: bash
        run: |
          # .pem 키 파일 생성 후 권한 설정 (600 = 본인만 읽기 가능, SSH 요구사항)
          echo "$EC2_SSH_KEY" > private_key.pem
          chmod 600 private_key.pem

          # plain.jar 제외하고 실제 실행 가능한 JAR 파일 경로 찾기
          jar_file=$(find build/libs -name '*.jar' ! -name '*plain.jar' | head -n 1)
          jar_name=$(basename "$jar_file")

          # Firebase JSON 을 임시 파일로 저장
          # → yml 에 넣지 않고 파일로 EC2 에 전송 후 환경변수로 주입할 예정
          printf '%s' "$FCM_SERVICE_ACCOUNT_JSON" > fcm.json

          # JAR 파일과 Firebase JSON 파일을 EC2 서버로 전송
          scp -i private_key.pem -o StrictHostKeyChecking=no "$jar_file" fcm.json \
            "$EC2_USERNAME@$EC2_HOST:/home/$EC2_USERNAME/"

          # EC2 서버에 SSH 접속해서 아래 명령어들 순서대로 실행
          ssh -i private_key.pem -o StrictHostKeyChecking=no "$EC2_USERNAME@$EC2_HOST" "
            # 현재 실행 중인 Java 프로세스(기존 앱) 종료
            pgrep java | xargs -r kill -15
            sleep 10

            # Firebase JSON 을 환경변수로 주입
            # application.yml 의 \${FCM_SERVICE_ACCOUNT_JSON:} 가 이 환경변수를 읽어감
            # → yml 에 직접 값을 넣지 않아도 Spring 이 실행 시점에 환경변수에서 가져옴
            export FCM_SERVICE_ACCOUNT_JSON=\"\$(cat /home/$EC2_USERNAME/fcm.json)\"

            # Spring Boot 앱 백그라운드 실행 (nohup = 터미널 종료 후에도 계속 실행)
            nohup java -jar /home/$EC2_USERNAME/$jar_name > app.log 2>&1 &

            # 보안을 위해 Firebase JSON 파일 즉시 삭제
            rm -f /home/$EC2_USERNAME/fcm.json
          "

          # 로컬(GitHub Actions 러너)에 생성한 임시 파일 정리
          rm -f private_key.pem fcm.json
