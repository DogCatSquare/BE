<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>어드민 로그인</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #fff;
            padding: 48px 40px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            font-size: 22px;
            color: #222;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 13px;
            color: #999;
            margin-bottom: 32px;
        }
        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #4a90e2;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #4a90e2;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #357abd; }
        .error-msg {
            background: #fff0f0;
            color: #e53935;
            border: 1px solid #ffcdd2;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>어드민 로그인</h2>
    <p class="subtitle">DC Square 관리자 페이지</p>

    <!-- 로그인 실패 시 Spring Security가 ?error 파라미터를 붙여서 리다이렉트함 -->
    <div class="error-msg" th:if="${param.error}">
        아이디 또는 비밀번호가 올바르지 않습니다.
    </div>

    <!--
      action="/admin/login" → SecurityConfig의 loginProcessingUrl과 일치해야 함
      Spring Security가 이 요청을 가로채서 인증 처리함 (컨트롤러 불필요)
    -->
    <form action="/admin/login" method="post">
        <div class="form-group">
            <label for="username">아이디</label>
            <!-- name="username" → Spring Security 기본 파라미터명 -->
            <input type="text" id="username" name="username" placeholder="아이디를 입력하세요"/>
        </div>
        <div class="form-group">
            <label for="password">비밀번호</label>
            <!-- name="password" → Spring Security 기본 파라미터명 -->
            <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요"/>
        </div>
        <button type="submit" class="btn-login">로그인</button>
    </form>
</div>
</body>
</html>
