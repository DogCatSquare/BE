<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>공지사항 수정</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      padding: 60px 20px;
    }

    .container {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 640px;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 28px;
      color: #222;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: #4a90e2;
    }

    textarea {
      resize: vertical;
      min-height: 180px;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #4a90e2;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: #357abd;
    }

    .link-back {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: #888;
      text-decoration: none;
    }

    .link-back:hover {
      color: #4a90e2;
    }
  </style>
</head>
<body>
<div class="container">
  <h2>공지사항 수정</h2>
  <form th:action="@{/admin/notices/{id}/edit(id=${notice.id})}" method="post">
    <div class="form-group">
      <label for="title">제목</label>
      <input type="text" id="title" name="title" th:value="${notice.title}" placeholder="제목을 입력하세요"/>
    </div>
    <div class="form-group">
      <label for="content">내용</label>
      <textarea id="content" name="content" placeholder="내용을 입력하세요" th:text="${notice.content}"></textarea>
    </div>
    <button type="submit" class="btn-submit">수정 완료</button>
  </form>
  <a th:href="@{/admin/notices/{id}(id=${notice.id})}" class="link-back">← 취소</a>
</div>
</body>
</html>
